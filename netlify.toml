[build]
  command = "npm run build"
  publish = "dist"

# Skip leftover Next.js runtime from the Netlify UI (this site is Astro).
# Also disable @netlify/plugin-nextjs under Site configuration → Build plugins.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  PUBLIC_AIRPORT_DATA_URL = "https://d3fuhsnkvtfott.cloudfront.net"

[[redirects]]
  from = "/Derek_Shirley_Resume_2025.pdf"
  to = "/Derek_Shirley_Resume_2026.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/projects"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/projects/*"
  to = "/work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/customer-dashboard"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/videoGameSales"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/TTRPGSentiments"
  to = "/work"
  status = 301
  force = true

# Keep in sync with securityHeaders(false) in src/lib/security.ts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://d3fuhsnkvtfott.cloudfront.net; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000"
