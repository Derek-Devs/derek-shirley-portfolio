[build]
  command = "npm run build"
  publish = "dist"

# Skip leftover Next.js runtime from the Netlify UI (this site is Astro).
# Also disable @netlify/plugin-nextjs under Site configuration → Build plugins.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  PUBLIC_AIRPORT_DATA_URL = "https://d3fuhsnkvtfott.cloudfront.net"

[[redirects]]
  from = "/Derek_Shirley_Resume_2025.pdf"
  to = "/Derek_Shirley_Resume_2026.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/projects"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/projects/*"
  to = "/work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/customer-dashboard"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/videoGameSales"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/TTRPGSentiments"
  to = "/work"
  status = 301
  force = true
