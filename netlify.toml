[build]
  command = "npm run build"
  publish = "dist"

# Skip leftover Next.js runtime from the Netlify UI (this site is Astro).
# Also disable @netlify/plugin-nextjs under Site configuration → Build plugins.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/projects"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/projects/*"
  to = "/work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/customer-dashboard"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/videoGameSales"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/TTRPGSentiments"
  to = "/work"
  status = 301
  force = true
