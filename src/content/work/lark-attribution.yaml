title: Rebuilding Lark’s acquisition attribution
organization: Lark Health
kind: professional
summary: Incomplete tracking and conflicting attribution rules left channel performance unreliable as direct mail faced discontinuation.
impact: Findings reversed the decision to discontinue direct mail, a channel with $550K in annual spend. Unknown attribution fell from about 42% to 8% on a trailing 365-day view. Recovered attribution is a measurement correction, not causal lift.
