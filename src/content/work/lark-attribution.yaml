title: Rebuilding acquisition attribution around observable evidence
organization: Lark Health
kind: professional
summary: Independent first-match classifiers, hard-coded rules, and incomplete tracking left about 42% of enrollments unresolved, so channel performance and CAC could not be trusted.
impact: Unknown attribution fell from about 42% to 8%. For one partner population in Q4 2025, direct mail’s measured share of enrollments changed from about 4% to 38%, and the channel stayed in use instead of being retired.
